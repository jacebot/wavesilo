<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2 busts the browser favicon cache from the old teal brand (favicons are
         cached hard and survive normal reloads). SVG first for crisp modern tabs,
         PNG fallback for browsers without SVG-favicon support. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Silo - Sample Manager</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
